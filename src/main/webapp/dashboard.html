<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Employee Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-container {
            max-width: 1000px;
            width: 95%;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            color: white;
        }

        .welcome-header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid white;
            padding: 0.5rem 1rem;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Leave History Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            font-weight: 600;
            color: var(--text-muted);
        }

        .status-APPROVED {
            color: #4ade80;
        }

        .status-PENDING {
            color: #facc15;
        }

        .status-REJECTED {
            color: #f87171;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <div class="welcome-header">
            <h2 id="welcome-msg">Hello, User</h2>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>

        <!-- Apply for Leave Section -->
        <div class="card">
            <h3>Apply for Leave</h3>
            <form id="leaveForm" style="margin-top: 1rem;">
                <div class="input-group">
                    <label>Leave Type</label>
                    <select id="leaveType" required
                        style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white;">
                        <option value="SICK" style="color: black;">Sick Leave</option>
                        <option value="CASUAL" style="color: black;">Casual Leave</option>
                        <option value="EARNED" style="color: black;">Earned Leave</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Start Date</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="input-group">
                    <label>End Date</label>
                    <input type="date" id="endDate" required>
                </div>
                <div class="input-group">
                    <label>Reason</label>
                    <input type="text" id="reason" placeholder="Brief reason..." required>
                </div>
                <button type="submit" class="btn-primary">Submit Request</button>
                <p id="leave-msg" class="error-text" style="color: #4ade80;"></p>
            </form>
        </div>

        <!-- Leave History Section -->
        <div class="card">
            <h3>Your Leave History</h3>
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="leaveTableBody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Inline JS for Dashboard logic


        const user = JSON.parse(localStorage.getItem('user'));

        if (!user) {
            window.location.href = 'index.html';
        }


        document.getElementById('welcome-msg').textContent = `Hello, ${user.fullName}`;

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        // Load Leaves
        async function loadLeaves() {
            try {
                // Use relative AP path
                const res = await fetch(`api/leaves?empId=${user.empId}`);
                if (res.ok) {
                    const leaves = await res.json();
                    const tbody = document.getElementById('leaveTableBody');
                    tbody.innerHTML = leaves.map(l => `
                        <tr>
                            <td>${l.leaveType}</td>
                            <td>${l.startDate}</td>
                            <td>${l.endDate}</td>
                            <td class="status-${l.status}">${l.status}</td>
                        </tr>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        loadLeaves();

        // Handle Apply Leave
        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                empId: user.empId,
                leaveType: document.getElementById('leaveType').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                reason: document.getElementById('reason').value
            };

            const msg = document.getElementById('leave-msg');
            msg.textContent = 'Submitting...';

            try {
                const res = await fetch('api/leaves', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    msg.textContent = 'Leave Applied Successfully!';
                    loadLeaves(); // Refresh table
                    e.target.reset();
                } else {
                    msg.textContent = 'Failed to apply.';
                    msg.style.color = 'red';
                }
            } catch (err) {
                console.error(err);
                msg.textContent = 'Error connecting to server.';
            }
        });
    </script>
</body>

</html>
